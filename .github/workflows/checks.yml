name: Offline building blocks
on: [push, pull_request]
jobs:
  cpu:
    runs-on: ubuntu-latest
    env:
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -r requirements.txt
      - run: python tools/render_catalog.py && git diff --exit-code
      - run: python tools/check_repo.py
      - run: python -m vision.curriculum.smoke_test
      - run: python tools/check_curriculum_notebooks.py
      - run: python -m unittest discover -s tests -v
      - run: python tools/smoke_recipes.py
